[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubdict"
version = "0.1.12"
description = "Cross-platform English-Chinese desktop dictionary"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "pytesseract>=0.3.10",
    "PyMuPDF>=1.23",
    "mss>=9.0",
    "python-xlib>=0.33; platform_system != 'Windows'",
    "httpx>=0.27",
    "pydantic>=2.0",
    "loguru>=0.7",
    "selectolax>=0.3",
    "tomli_w>=1.0",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
]

[project.scripts]
ubdict = "ubdict.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
